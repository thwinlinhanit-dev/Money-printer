[package]
name = "mp-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Backtester & simulation — spec 005 (event replay, fills, accounting, determinism)"

[lib]
name = "mp_sim"
path = "src/lib.rs"

[dependencies]
mp-core = { path = "../core" }
mp-features = { path = "../features" }
mp-strategies = { path = "../strategies" }
mp-risk = { path = "../risk" }
# The daily determinism check (mp-determinism, spec 018 MOD-9..11) loads the
# day's raw logs and writes the gate artifact through mp-storage — the SAME
# loader (`load_logs_merged`) and artifact layout the materializer and the
# promotion gate use, so replay inputs == materializer inputs and the gate
# reads one artifact convention.
mp-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Runs the PRODUCTION feature engine, strategy, and sizing crates unmodified
# (SIM-5) — only the clock and fill model differ from live. No network.

[lints]
workspace = true
