<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>termd — recorded market viewer</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --up: #3fb950;
    --down: #f85149;
    --gold: #e3b341;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header label { color: var(--dim); }
  select, button { background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  header h1 { font-size: 14px; margin: 0 8px 0 0; }
  #status { margin-left: auto; color: var(--dim); max-width: 60%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #status.error { color: var(--down); }
  .grid { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr 1fr;
    gap: 8px; padding: 8px; height: calc(100% - 49px); }
  .pane { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    position: relative; overflow: hidden; }
  .pane .label { position: absolute; top: 6px; left: 10px; color: var(--dim);
    font-size: 11px; z-index: 2; text-transform: uppercase; letter-spacing: .04em; }
  canvas { width: 100%; height: 100%; display: block; }
  #mainPane { grid-column: 1; grid-row: 1 / span 2; }
  #cvdPane { grid-column: 1; grid-row: 2; }
  #domPane { grid-column: 2; grid-row: 1; }
  #stripPane { grid-column: 2; grid-row: 2; }
  #domBody { position: absolute; inset: 26px 10px 10px; overflow-y: auto; font: 12px monospace; }
  #domBody table { width: 100%; border-collapse: collapse; }
  #domBody td { padding: 1px 4px; }
  #domBody .px { color: var(--text); }
  #domBody .qty { color: var(--dim); text-align: right; }
  #domBody tr.bid .px { color: var(--up); }
  #domBody tr.ask .px { color: var(--down); }
  .empty { display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--dim); font-style: italic; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <h1>termd</h1>
    <label>venue <select id="venue"></select></label>
    <label>symbol <select id="symbol"></select></label>
    <label>date <select id="date"></select></label>
    <label>tf <select id="tf">
      <option value="60">60s</option><option value="300">5m</option>
      <option value="900">15m</option><option value="3600">1h</option>
    </select></label>
    <label>footprint <select id="bucket">
      <option value="mid">mid</option><option value="small">small</option>
      <option value="whale">whale</option>
    </select></label>
    <label>kind <select id="kind">
      <option value="delta">delta</option><option value="imb">imbalance</option>
    </select></label>
    <button id="refresh">refresh</button>
    <span id="status">loading…</span>
  </header>
  <div class="grid">
    <div class="pane" id="mainPane"><span class="label">price · footprint · whales</span>
      <canvas id="main"></canvas></div>
    <div class="pane" id="cvdPane"><span class="label">cumulative volume delta</span>
      <canvas id="cvd"></canvas></div>
    <div class="pane" id="domPane"><span class="label">order book</span>
      <div id="domBody"></div></div>
    <div class="pane" id="stripPane"><span class="label">funding rate · oi delta</span>
      <canvas id="strip"></canvas></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
