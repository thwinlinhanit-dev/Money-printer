[pytest]
# pytest-asyncio is installed in some dev environments even though this suite
# is pure-stdlib (no async fixtures). Pin the default fixture loop scope
# explicitly so the PytestDeprecationWarning ("asyncio_default_fixture_loop_scope
# unset") stays silent, and so a future pytest-asyncio default change cannot
# alter behavior under us (audit 2026-08-06). "function" matches the upcoming
# default and is what any async fixture here would want.
asyncio_default_fixture_loop_scope = function
