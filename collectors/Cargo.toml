[package]
name = "mp-collectors"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Venue WS collectors → normalized events — spec 002 (offline core; live transport deferred)"

[lib]
name = "mp_collectors"
path = "src/lib.rs"

[features]
# Live public market-data WebSocket transport (tokio + tokio-tungstenite).
# Off by default so the pure normalization/logic builds with no network stack.
# PD-1: public data only — this transport never sends orders or auth.
live-ws = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:url", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
# Live HTTP client for REST snapshot fetches (spec 020). Separate from live-ws
# so snapshot fetch can be added independently. tokio (already an optional
# dependency for live-ws, incl. the `signal` feature) is shared here so the
# REST poller binaries get the same SIGTERM/Ctrl+C shutdown flag (spec 014
# FSP-4 collector side) without a new dependency.
live-http = ["dep:reqwest", "dep:ring", "dep:tokio"]

[dependencies]
mp-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
smallvec.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "0.26", optional = true }
futures-util = { version = "0.3", optional = true }
url = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"], optional = true }
# HMAC-SHA256 for Binance USER_DATA signed requests (COL-29 allForceOrders
# liquidation fetch). Same crate family the TLS stack already vendors; kept
# optional behind live-http since only the signed REST path needs it.
ring = { version = "0.17", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
