# One public-market-data collector owns exactly this venue/symbol recording.
# Start with:
# cargo run -p mp-collectors --features live-ws,live-http --bin mp-collector -- --config collectors/binance-btcusdt.example.toml
venue = "binance"
symbol = "BTCUSDT"
data_dir = "data"
channel_capacity = 10000
backpressure = "drop_oldest"
# COL-25/27: "ws" (default) or "rest". REST mode ingests trades from
# fapi/v1/aggTrades (fromId watermark) and suppresses WS aggTrade — required
# while fstream silently drops the trade stream (spec 024 incident 08-04).
trade_source = "rest"
# COL-28: "ws" (default) or "rest". REST mode ingests mark price + funding
# from fapi/v1/premiumIndex (~15s) and suppresses WS markPriceUpdate — required
# while fstream silently drops the markPrice stream (spec 024 incident 08-04).
# Independent of trade_source so either stream can be restored without
# disturbing the other.
mark_source = "rest"
# Egress proxy for the WS connection (spec 024 incident 08-04): use this when
# the venue edge geo-filters this network (fstream drops non-book streams from
# some regions). Supported: "http://host:port" (HTTP CONNECT) and
# "socks5://host:port". The MP_WS_PROXY env var overrides this when set.
# Verify the filter/fix with: node ops/scripts/ws_probe.mjs (direct probe;
# full procedure in ops/runbooks/ws-egress-filter.md).
# proxy = "socks5://127.0.0.1:1080"
