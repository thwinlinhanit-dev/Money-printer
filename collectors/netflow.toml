# Exchange-reserve balance poller (spec 034) — LIVE watchlist.
# Key comes from the environment ONLY (PD-2): $env:MP_ETHERSCAN_KEY
# Addresses are well-known PUBLIC exchange hot wallets (Etherscan-labeled).
# Labels are for operator logs only — never recorded into events (NFL-3).

data_dir = "data"

# NFL-1 default cadence.
poll_interval_s = 300

# Etherscan free tier: 5 calls/sec — 250ms per wallet keeps us under it.
min_poll_gap_ms = 250

