name: ci

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rulebook guardrails (PD-1..4, W-7, CONV-21)
        run: bash ops/ci/guardrails.sh
      - name: Requirement-coverage matrix (artifact; informational)
        run: bash ops/ci/coverage_report.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect workspace
        id: detect
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Rust
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.present == 'true'
      - name: fmt
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --check
      - name: clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (CONV-24; no network per CONV-23)
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace
      - name: feature-gated builds compile (live-ws / live-http)
        if: steps.detect.outputs.present == 'true'
        run: |
          cargo clippy -p mp-collectors --features live-ws --all-targets -- -D warnings
          cargo clippy -p mp-llm --features live-http --all-targets -- -D warnings
          # live-http feature-gated clippy for the two crates that expose a
          # REST edge (spec 027 HBS-1 HBS-8 historical bootstrap in mp-storage;
          # spec 020 snapshot fetch in mp-collectors) — the default-feature
          # clippy above does NOT see these code paths, so a live-only lint
          # would ship silently (verified passing 2026-08-06).
          cargo clippy -p mp-storage --features live-http --all-targets -- -D warnings
          cargo clippy -p mp-collectors --features live-http --all-targets -- -D warnings
      - name: No workspace yet
        if: steps.detect.outputs.present == 'false'
        run: echo "No Cargo.toml — docs/specs-only change, rust job is a no-op."

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps (pytest, polars, ruff)
        run: pip install pytest polars ruff
      - name: Format check (ruff format --check; config research/ruff.toml)
        run: cd research && ruff format --check .
      - name: Research tests (RES-1..6, pure stdlib)
        run: cd research && python -m pytest -q

  deps-audit:
    runs-on: ubuntu-latest
    # NOTE: paths-filtering is workflow-level only in GitHub Actions and would
    # starve the other jobs (guardrails must run on docs-only pushes), so this
    # job runs unconditionally — the prebuilt action makes it cheap (~30s).
    steps:
      - uses: actions/checkout@v4
      - name: Detect lockfile
        id: detect
        run: |
          if [ -f Cargo.lock ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # RustSec advisory audit (cargo-audit via the official rustsec/audit-check
      # action; prebuilt binary + auto-updated advisory DB). Fails the job only
      # on security advisories — unmaintained/informational advisories are
      # reported but non-blocking (verified 2026-08-14 after the spec 001
      # codec amendment: lockfile has 0 vulns; only paste 1.0.15
      # RUSTSEC-2024-0436 remains
      # flagged unmaintained — tracked as known debt in docs/BACKLOG.md;
      # RUSTSEC-2025-0141 cleared by the bincode-next swap).
      - name: Audit dependencies (RustSec)
        if: steps.detect.outputs.present == 'true'
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
