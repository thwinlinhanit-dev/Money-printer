# Swing-horizon materialization config (spec 035 SWG-2): 4h bars.
# Bar-only features only — bar_tf_ns drives the swing window semantics.
# Windows in bar counts (4h): 20 bars = 80h, 48 bars = 8 days.
bar_tf_ns = 14400000000000

[swing]
realized_vol_window = 20
trend_lookback = 20
value_area_window = 48
value_area_bucket = 50.0
rolling_vwap_bars = 48